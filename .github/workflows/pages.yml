name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'supabase/**', 'collector/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # 实测两次出现「产物已上传成功，但 Publish 立刻查不到 github-pages」，
      # 补一个短暂等待，避开产物列表的最终一致性延迟。
      - run: sleep 5
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5

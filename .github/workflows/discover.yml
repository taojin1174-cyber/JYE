name: Discover public price leads
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0,6,12 * * *'
permissions:
  contents: write
concurrency:
  group: public-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public lists
        id: fetch
        continue-on-error: true
        run: node scripts/discovery.mjs --cloud
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 肉交所快照不再进仓库（含供应商联系方式），本机采集时直接入库；
      # 有这个文件才合并，没有就跳过，避免工作流因为缺文件而失败。
      - name: Merge frozen-poultry leads
        run: |
          if [ -f data/roujiaosuo-leads.json ]; then
            node scripts/import-roujiaosuo-leads.mjs --cloud --only-frozen
          else
            echo "无本地肉交所快照，跳过合并（该品类由本机采集后直接写库）"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 采集结果只写数据库，不回写仓库：公开仓库不得留有任何业务数据快照。
      # GITHUB_TOKEN 推送不会触发另一个 push 工作流，因此在此明确构建与发布。
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: discovered-site
          path: dist
      # 单个来源失败属于常态（站点改版、地区网络限制、限流），不应把整次运行标红。
      # 失败源保留上一版线索，页面照常发布；失败明细写入运行摘要，便于事后核对。
      - name: Report partial source failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::部分公开来源本次未取到数据，已沿用上一版线索，页面照常发布。"
          {
            echo "### 部分来源抓取失败"
            echo ""
            echo "以下来源本次未取到数据，页面继续使用上一次成功快照里的对应线索："
            echo ""
            node -e "const d=require('./data/discovery.json');const bad=(d.runs||[]).filter(r=>!r.ok);if(bad.length){for(const r of bad)console.log('- \`'+r.source_id+'\`：'+r.error)}else{console.log('（快照内未记录失败源）')}"
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: discover
    if: always() && needs.discover.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: discovered-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

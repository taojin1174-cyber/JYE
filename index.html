<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#177454">
  <meta name="description" content="禽畜产品采购比价：报价记录、同规格参考均价与采购比较。">
  <title>行情跳动 · 禽畜采购参考</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/settings.css">
</head>
<body>
  <div id="app"><p class="loading">正在打开行情跳动…</p></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <script>
    (() => {
      function showRetry() {
        if (!document.querySelector('#app .loading')) return;
        document.getElementById('app').innerHTML = '<div class="error-panel"><h1>页面暂未加载完成</h1><p>请检查网络后重新打开。</p><button class="btn" id="retry-load">重新加载</button></div>';
        document.getElementById('retry-load').addEventListener('click', () => location.reload());
      }
      window.addEventListener('error', showRetry, true);
      window.addEventListener('unhandledrejection', showRetry);
      setTimeout(showRetry, 20000);
    })();
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>

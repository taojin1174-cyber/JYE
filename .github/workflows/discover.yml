name: Discover public price leads
on:
  workflow_dispatch:
  # 采集脚本一改就立刻跑一次，避免「改完不知道云端能不能跑通」，要等到第二天定时才暴露问题。
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover.yml'
      - 'scripts/discovery.mjs'
      - 'scripts/consume-pending.mjs'
      - 'scripts/queue-leads.mjs'
      - 'scripts/roujiaosuo-*.mjs'
      - 'collector/**'
      # 本机排队的线索一推上来就立刻入库，不必等到下一次定时。
      - 'data/pending/**'
  schedule:
    - cron: '10 0,6,12 * * *'
permissions:
  contents: write
concurrency:
  group: public-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 凭证缺失时 discovery.mjs 会静默跳过写库、整步仍显示成功，等于采集白跑。
      # 这里先硬失败一次，让「没写进数据库」在页面上立刻可见。
      - name: Check cloud credentials
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::缺少 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY，本次采集不会写入数据库。请在 Settings → Secrets and variables → Actions 中补齐。"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 国内行情站对境外机房 IP 基本不通，本机又连不上 *.supabase.co，
      # 于是拆成两段：本机抓、仓库中转、云端写。先把队列消化掉，再抓新数据。
      - name: Consume leads queued by local runs
        continue-on-error: true
        run: node scripts/consume-pending.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 只有入库成功才会删掉队列文件；失败则原样留在仓库里，下次运行自动重试。
      - name: Drop consumed queue files
        run: |
          # 队列消费完后目录可能整个消失（git 不保留空目录），
          # 此时 git add 会报 pathspec 不匹配并把后续步骤全部跳过。
          if [ ! -d data/pending ]; then
            echo "队列目录不存在，无需清理"
            exit 0
          fi
          git add -A data/pending
          if git diff --cached --quiet; then
            echo "队列无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: 清空已入库的待处理线索队列"
          git pull --rebase --autostash origin main || true
          git push || echo "::warning::队列清理提交推送失败，下次运行会重试"

      - name: Fetch public lists
        id: fetch
        continue-on-error: true
        run: node scripts/discovery.mjs --cloud
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 肉交所四品类（清远鸡 / 白条鹅 / 清远麻鸡 / 鸽子）过去只在本机抓，
      # 本机不开机就断更。这里改为云端直接抓公开页面，抓完写库，快照不落仓库。
      - name: Scrape frozen-poultry marketplace
        continue-on-error: true
        run: |
          mkdir -p data
          node scripts/roujiaosuo-scrape.mjs

      - name: Build frozen-poultry sheet
        if: hashFiles('data/roujiaosuo-leads.json') != ''
        run: node scripts/roujiaosuo-build.mjs

      - name: Import frozen-poultry leads
        if: hashFiles('data/roujiaosuo-leads.json') != ''
        run: node scripts/import-roujiaosuo-leads.mjs --cloud --only-frozen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 采集结果只写数据库，不回写仓库：公开仓库不得留有任何业务数据快照。
      # GITHUB_TOKEN 推送不会触发另一个 push 工作流，因此在此明确构建与发布。
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: discovered-site
          path: dist
      # 单个来源失败属于常态（站点改版、地区网络限制、限流），不应把整次运行标红。
      # 失败源保留上一版线索，页面照常发布；失败明细写入运行摘要，便于事后核对。
      - name: Report partial source failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::部分公开来源本次未取到数据，已沿用上一版线索，页面照常发布。"
          {
            echo "### 部分来源抓取失败"
            echo ""
            echo "以下来源本次未取到数据，页面继续使用上一次成功快照里的对应线索："
            echo ""
            node -e "const d=require('./data/discovery.json');const bad=(d.runs||[]).filter(r=>!r.ok);if(bad.length){for(const r of bad)console.log('- \`'+r.source_id+'\`：'+r.error)}else{console.log('（快照内未记录失败源）')}"
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: discover
    if: always() && needs.discover.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: discovered-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

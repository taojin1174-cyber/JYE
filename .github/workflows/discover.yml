name: Discover public price leads
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0,6,12 * * *'
permissions:
  contents: write
concurrency:
  group: public-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public lists
        id: fetch
        continue-on-error: true
        run: node scripts/discovery.mjs --cloud
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Save public snapshot
        run: |
          if [ -f data/discovery.json ]; then
            git add data/discovery.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update public price leads'
              git push
            fi
          fi
      # GITHUB_TOKEN 推送不会触发另一个 push 工作流，因此在此明确构建与发布。
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: discovered-site
          path: dist
      - name: Report partial source failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
  publish:
    needs: discover
    if: always() && needs.discover.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: discovered-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

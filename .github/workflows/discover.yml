name: Discover public price leads
on:
  workflow_dispatch:
  # 采集脚本一改就立刻跑一次，避免「改完不知道云端能不能跑通」，要等到第二天定时才暴露问题。
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover.yml'
      - 'scripts/discovery.mjs'
      - 'scripts/source-summary.mjs'
      - 'scripts/consume-pending.mjs'
      - 'scripts/queue-leads.mjs'
      - 'scripts/roujiaosuo-*.mjs'
      - 'collector/**'
      # 本机排队的线索一推上来就立刻入库，不必等到下一次定时。
      - 'data/pending/**'
  schedule:
    - cron: '10 0,6,12 * * *'
permissions:
  contents: write
concurrency:
  group: public-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 凭证缺失时 discovery.mjs 会静默跳过写库、整步仍显示成功，等于采集白跑。
      # 这里先硬失败一次，让「没写进数据库」在页面上立刻可见。
      - name: Check cloud credentials
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::缺少 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY，本次采集不会写入数据库。请在 Settings → Secrets and variables → Actions 中补齐。"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 国内行情站对境外机房 IP 基本不通，本机又连不上 *.supabase.co，
      # 于是拆成两段：本机抓、仓库中转、云端写。先把队列消化掉，再抓新数据。
      - name: Consume leads queued by local runs
        continue-on-error: true
        run: node scripts/consume-pending.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 只有入库成功才会删掉队列文件；失败则原样留在仓库里，下次运行自动重试。
      - name: Drop consumed queue files
        run: |
          # 队列消费完后目录可能整个消失（git 不保留空目录），
          # 此时 git add 会报 pathspec 不匹配并把后续步骤全部跳过。
          if [ ! -d data/pending ]; then
            echo "队列目录不存在，无需清理"
            exit 0
          fi
          git add -A data/pending
          if git diff --cached --quiet; then
            echo "队列无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: 清空已入库的待处理线索队列"
          git pull --rebase --autostash origin main || true
          git push || echo "::warning::队列清理提交推送失败，下次运行会重试"

      - name: Fetch public lists
        id: fetch
        continue-on-error: true
        run: node scripts/discovery.mjs --cloud
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 肉交所四品类（清远鸡 / 白条鹅 / 清远麻鸡 / 鸽子）过去只在本机抓，
      # 本机不开机就断更。这里改为云端直接抓公开页面，抓完写库，快照不落仓库。
      - name: Scrape frozen-poultry marketplace
        continue-on-error: true
        run: |
          mkdir -p data
          node scripts/roujiaosuo-scrape.mjs

      - name: Build frozen-poultry sheet
        if: hashFiles('data/roujiaosuo-leads.json') != ''
        run: node scripts/roujiaosuo-build.mjs

      - name: Import frozen-poultry leads
        if: hashFiles('data/roujiaosuo-leads.json') != ''
        run: node scripts/import-roujiaosuo-leads.mjs --cloud --only-frozen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 每天第一次运行（UTC 06:00 前）把云端全库导出一份留档。
      # 本地备份只有偶尔手工做，一旦云端数据库出问题，最近的人工快照可能已经很旧。
      # 公开仓库不能提交业务数据，所以只上传 artifact，不进 git；保留 14 天，随时可下载。
      - name: Decide backup window
        id: window
        if: always()
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -lt 6 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "备份时段（UTC ${hour} 时），本次会导出全库快照。"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "非备份时段（UTC ${hour} 时），跳过全库快照。"
          fi

      - name: Export cloud database snapshot
        if: always() && steps.window.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/backup-cloud.mjs --out cloud-backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload cloud snapshot
        if: always() && steps.window.outputs.run == 'true' && hashFiles('cloud-backup/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloud-backup-${{ github.run_id }}
          path: cloud-backup
          retention-days: 14

      # 每次运行都写摘要，不只在失败时写。
      # 单源失败属于常态（站点改版、地区网络限制、限流），不应把整次运行标红；
      # 但「某个源返回 0 条」不会抛错，过去完全不可见，只能等数据变少才发现。
      # 这里把每个源的状态和条数列成表，异常源带 ⚠️/❌，并发 warning 注解。
      - name: Write source summary
        if: always()
        run: node scripts/source-summary.mjs --expect-roujiaosuo
      # 采集结果只写数据库，不回写仓库：公开仓库不得留有任何业务数据快照。
      # GITHUB_TOKEN 推送不会触发另一个 push 工作流，因此在此明确构建与发布。
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: discovered-site
          path: dist
  publish:
    needs: discover
    if: always() && needs.discover.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: discovered-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
